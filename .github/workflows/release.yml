name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: truncate/package-lock.json

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Build for both Intel and Apple Silicon on macOS
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install dependencies
        run: |
          cd truncate
          npm install

      - name: Build App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: truncate

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.platform }}
          path: |
            truncate/src-tauri/target/release/bundle/dmg/*.dmg
            truncate/src-tauri/target/release/bundle/msi/*.msi
            truncate/src-tauri/target/release/bundle/nsis/*.exe
            truncate/src-tauri/target/release/bundle/deb/*.deb
            truncate/src-tauri/target/release/bundle/appimage/*.AppImage
            truncate/src-tauri/target/release/bundle/macos/*.app.tar.gz
            truncate/src-tauri/target/release/latest.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tauri-artifacts-*
          merge-multiple: true

      - name: Release to Public Repo
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          repository: Truncate-org/truncate-releases
          tag_name: ${{ github.ref_name }}
          name: "Truncate ${{ github.ref_name }}"
          body: "Official release of Truncate IDE."
          draft: true
          prerelease: false
          files: artifacts/**/*
