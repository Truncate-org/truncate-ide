name: Feature Request
description: Suggest an idea or enhancement for Truncate IDE
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        - Search [existing issues](https://github.com/Truncate-org/truncate-ide/issues?q=is%3Aissue) and
          [Discussions](https://github.com/Truncate-org/truncate-ide/discussions) first.
        - For open-ended ideas or questions, a [Discussion](https://github.com/Truncate-org/truncate-ide/discussions) is often the better place to start.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: This request is about Truncate IDE itself, not a third-party dependency.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what makes it hard or impossible today?
      placeholder: "I'm always frustrated when …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen. Sketch the UI or workflow if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you currently use, or how other tools solve this.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this relate to?
      multiple: true
      options:
        - SQL editor (Monaco)
        - Database Explorer
        - Query results / data grid
        - Data Audit / Profiling
        - AI Copilot (Ollama)
        - Integrated terminal
        - Connections / credentials
        - Schema export / visualization
        - Updater / packaging
        - Accounts / licensing
        - Other
    validations:
      required: false

  - type: dropdown
    id: engines
    attributes:
      label: Relevant database engines
      multiple: true
      options:
        - MySQL
        - PostgreSQL
        - SQLite
        - CSV
        - All / engine-agnostic
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links, examples, or anything else that helps explain the request.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to help implement this feature.
          required: false
