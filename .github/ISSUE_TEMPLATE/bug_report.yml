name: Bug Report
description: Report a reproducible problem in Truncate IDE
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        - Search [existing issues](https://github.com/Truncate-org/truncate-ide/issues?q=is%3Aissue) first — it may already be reported.
        - **Do not** report security vulnerabilities here. Follow [SECURITY.md](https://github.com/Truncate-org/truncate-ide/blob/main/SECURITY.md).
        - **Never paste real credentials, connection strings with passwords, or personal/customer data.** Redact them.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is a bug report, not a security vulnerability or a usage question.
          required: true
        - label: I can reproduce this on the latest released version (or a current `main` build).
          required: true
        - label: My report contains no real credentials or personal data.
          required: true

  - type: input
    id: version
    attributes:
      label: Truncate IDE version
      description: From the app's About/settings screen, or the release you downloaded.
      placeholder: "0.2.6"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (.deb)
        - Linux (AppImage)
        - Linux (built from source)
        - Windows
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 14.5 / Ubuntu 24.04 / Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      description: Which engine were you connected to when the bug occurred?
      options:
        - MySQL
        - PostgreSQL
        - SQLite
        - CSV
        - Not applicable / no connection
    validations:
      required: true

  - type: input
    id: engine-version
    attributes:
      label: Database engine version
      placeholder: "MySQL 8.0.36 (leave blank if not applicable)"
    validations:
      required: false

  - type: dropdown
    id: install-source
    attributes:
      label: How did you install Truncate?
      options:
        - Downloaded a release build
        - Built from source (npm run tauri dev)
        - Built from source (npm run tauri build)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Number each step. Include the SQL you ran, with data redacted.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: |
        Any error shown in the app. For source builds, include relevant output from the
        terminal running `npm run tauri dev`. This will be rendered as code — no backticks needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: area
    attributes:
      label: Affected area
      description: e.g. SQL editor, Database Explorer, Data Audit Panel, integrated terminal, AI Copilot, connections/keychain, updater.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, frequency (always / intermittent), recent changes, workarounds.
    validations:
      required: false
